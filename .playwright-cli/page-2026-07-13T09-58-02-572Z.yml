          - text: MISSION AND HISTORY
          - heading "Mission and history" [level=2] [ref=e64]
          - paragraph [ref=e65]: The Everlasting Foodbank SCIO was founded in Glasgow in 2014 by the treasurer and Pastor of Everlasting Arms Ministries Church in Dennistoun. The Everlasting Foodbank is a Christian organisation that serves the community of Dennistoun and beyond by providing food to those in need. Although we are a foodbank, we believe that "man cannot live by bread alone" (Matthew 4:4). Our goal is not just to feed people for a day, but to give them the confidence and encouragement they need to prosper every day.
          - link "Read more on the Foodbank website" [ref=e66] [cursor=pointer]:
            - /url: https://www.everlastingfoodbank.org/about
